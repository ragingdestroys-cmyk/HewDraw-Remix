[workspace]
members = ["dynamic", "fighters/common", "fighters/plizardon", "hdr-macros", "utils"]

resolver = "2"

[workspace.package]
version = "0.0.0-dev"
authors = ["HDR Development Team"]
edition = "2021"

[workspace.metadata.symbaker]
prefix = "hdr"

[workspace.dependencies]
skyline = { git = "https://github.com/ultimate-research/skyline-rs" }
skyline_smash = { git =  "https://github.com/ultimate-research/skyline-smash", features = ["weak_l2cvalue"] }
skyline-web = { git = "https://github.com/skyline-rs/skyline-web" }
smashline = { git = "https://github.com/HDR-Development/smashline" }
proc-hitbox = { git = "https://github.com/HDR-Development/compile-time-smash-script" }

dynamic = { path = "dynamic" }
hdr-macros = { path = "hdr-macros" }
utils = { path = "utils" }

plizardon = { path = "fighters/plizardon" }
common = { path = "fighters/common" }

[package]
name = "hdr"
version.workspace = true
authors.workspace = true
edition.workspace = true

[package.metadata.skyline]
titleid = "01006A800016E000"

[dependencies]
dynamic.workspace = true
plizardon = { workspace = true, optional = true }
locks = { git = "https://github.com/HDR-Development/smashline" }
once_cell = "1"
ninput = { git = "https://github.com/HDR-Development/ninput" }
rand = { git = "https://github.com/skyline-rs/rand" }
serde = { version = "1", features = ["derive"] }
toml = "0.8.20"
parking_lot = "0.12.3"
runtime-motion-patcher.git = "https://github.com/WuBoytH/runtime-motion-patcher"
skyline.workspace = true
skyline_smash.workspace = true
smashline.workspace = true
utils.workspace = true
hash40 = "1.2.0"
smash-arc = { version = "0.6.0", features = ["rust-zstd", "smash-runtime"] }
smash2 = { git = "https://github.com/WuBoytH/smash-rs", package = "smash" }
rlua-lua53-sys = { git = "https://github.com/HDR-Development/rlua", branch = "smash" }

[patch.crates-io]
nnsdk = { git = "https://github.com/ultimate-research/nnsdk-rs" }
libc = { git="https://github.com/rust-lang/libc", rev = "0.2.166"}

[features]
default = [
    "plizardon",
]
dev = ["utils/no-offset-search"]
main_nro = ["skyline-web", "common"]
runtime = []

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 'z'
panic = "abort"
lto = true
codegen-units = 1

[lib]
crate-type = ["cdylib"]
